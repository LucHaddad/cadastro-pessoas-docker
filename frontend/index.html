<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Pessoas e Endereços</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #0b5fff; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 30px; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .full-width { grid-column: span 2; }
    button { grid-column: span 2; padding: 12px; background: #0b5fff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
    th { background-color: #0b5fff; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📋 Cadastrar Pessoa / Endereço</h2>
    <form id="cadForm">
      <input type="text" id="nome" placeholder="Nome Completo" required class="full-width">
      <input type="text" id="cpf" placeholder="CPF" required>
      <input type="text" id="cep" placeholder="CEP (somente números)" onblur="buscarCep()" required>
      <input type="text" id="numero" placeholder="Número" required>
      <input type="text" id="complemento" placeholder="Complemento">
      <input type="text" id="logradouro" placeholder="Logradouro" readonly>
      <input type="text" id="bairro" placeholder="Bairro" readonly>
      <input type="text" id="localidade" placeholder="Cidade/Localidade" readonly>
      <input type="text" id="uf" placeholder="UF" readonly>
      <input type="text" id="estado" placeholder="Estado" readonly>
      <input type="text" id="rua" placeholder="Rua" readonly>
      <button type="submit">Cadastrar</button>
    </form>

    <h2>👥 Pessoas Cadastradas</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nome</th><th>CPF</th><th>CEP</th><th>Cidade/UF</th><th>Rua/Nº</th>
        </tr>
      </thead>
      <tbody id="tabelaPessoas"></tbody>
    </table>
  </div>

  <script>
    const API_URL = "http://localhost:3000/pessoas";

    async function buscarCep() {
      const cep = document.getElementById("cep").value.replace(/\D/g, "");
      if (cep.length === 8) {
        const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const data = await res.json();
        if (!data.erro) {
          document.getElementById("logradouro").value = data.logradouro || "";
          document.getElementById("bairro").value = data.bairro || "";
          document.getElementById("localidade").value = data.localidade || "";
          document.getElementById("uf").value = data.uf || "";
          document.getElementById("estado").value = data.estado || data.localidade;
          document.getElementById("rua").value = data.logradouro || "";
        }
      }
    }

    async function carregarPessoas() {
      const res = await fetch(API_URL);
      const pessoas = await res.json();
      const tbody = document.getElementById("tabelaPessoas");
      tbody.innerHTML = "";
      pessoas.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.id}</td>
            <td>${p.nome}</td>
            <td>${p.cpf}</td>
            <td>${p.cep}</td>
            <td>${p.localidade}/${p.uf}</td>
            <td>${p.rua}, ${p.numero}</td>
          </tr>
        `;
      });
    }

    document.getElementById("cadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        nome: document.getElementById("nome").value,
        cpf: document.getElementById("cpf").value,
        cep: document.getElementById("cep").value,
        numero: document.getElementById("numero").value,
        complemento: document.getElementById("complemento").value,
        logradouro: document.getElementById("logradouro").value,
        bairro: document.getElementById("bairro").value,
        localidade: document.getElementById("localidade").value,
        uf: document.getElementById("uf").value,
        estado: document.getElementById("estado").value,
        rua: document.getElementById("rua").value
      };

      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      document.getElementById("cadForm").reset();
      carregarPessoas();
    });

    carregarPessoas();
  </script>
</body>
</html>
